<!-- ============================================================================
  DASHBOARD DE OCORRÊNCIAS — CBMPE
  Card embutido, padrão "Planilhas corporativas integradas".
  Sem sidebar/topbar/breadcrumb: este arquivo é SÓ o conteúdo do card
  (tabs + filtros + gráficos), para ser inserido dentro do sistema anfitrião.

  Fontes de dado: ver status_ocorrencias.md para a origem (print/SQL/CSV) e
  o status de validação de cada quadrante. Cada item do DASHBOARD_DATA abaixo
  carrega seu próprio campo "status": "confirmed" (validado via SQL/CSV),
  "print" (validado por print + reconciliação de total) ou "pending"
  (achado de qualidade de dado sinalizado, não confirmado).
============================================================================ -->
<style>
:root{
  /* ---- Design tokens "Planilhas corporativas integradas" ----
     Confirmados por amostragem de pixel em sessão anterior (Dashboard DF). */
  --brand-sidebar:#970706;
  --brand-accent:#C51132;
  --brand-badge-bg:#F0DEE1;
  --text-primary:#161A22;
  --text-secondary:#828A99;
  --page-bg:#F4F4F4;
  --card-bg:#FFFFFF;
  --line:#E5E1E2;
  --amber:#B8720B;
  --amber-bg:#FBF1E2;
  --amber-border:#F0DEB4;
  --radius:10px;
  --shadow:0 1px 2px rgba(22,26,34,.05), 0 1px 8px rgba(22,26,34,.05);
  --font:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;
}
#ocorrencias-card *{box-sizing:border-box;}
#ocorrencias-card{
  font-family:var(--font);
  color:var(--text-primary);
  background:var(--page-bg);
  border-radius:var(--radius);
  -webkit-font-smoothing:antialiased;
}
#ocorrencias-card .tabs{
  display:flex;gap:2px;overflow-x:auto;background:var(--card-bg);
  border-bottom:1px solid var(--line);padding:0 18px;border-radius:var(--radius) var(--radius) 0 0;
}
#ocorrencias-card .tab-btn{
  appearance:none;border:none;background:none;cursor:pointer;
  font-family:var(--font);font-size:13.5px;font-weight:600;color:var(--text-secondary);
  padding:13px 15px;border-bottom:2px solid transparent;white-space:nowrap;
}
#ocorrencias-card .tab-btn:hover{color:var(--text-primary);}
#ocorrencias-card .tab-btn.active{color:var(--brand-sidebar);border-bottom-color:var(--brand-accent);}

#ocorrencias-card .filterbar{
  display:flex;gap:10px;padding:14px 18px;background:var(--card-bg);
  border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;
}
#ocorrencias-card .filter-select{
  font-family:var(--font);font-size:12.5px;color:var(--text-primary);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--page-bg);
  min-width:130px;cursor:pointer;
}
#ocorrencias-card .filter-note{
  font-size:11.5px;color:var(--text-secondary);margin-left:auto;font-style:italic;
}

#ocorrencias-card main{padding:18px;}
#ocorrencias-card .source-note{
  font-size:12px;color:var(--text-secondary);margin:0 0 16px 0;
  background:var(--brand-badge-bg);border:1px solid #e7c9cf;
  padding:8px 12px;border-radius:8px;
}
#ocorrencias-card .grid{
  display:grid;grid-template-columns:repeat(12,1fr);gap:14px;position:relative;
}
#ocorrencias-card .card{
  background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:15px 17px;
  display:flex;flex-direction:column;min-width:0;
}
#ocorrencias-card .card-title{
  font-size:13px;font-weight:700;color:var(--text-primary);margin:0 0 12px 0;
  display:flex;align-items:center;gap:6px;
}
#ocorrencias-card .status-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
}
#ocorrencias-card .status-dot.confirmed{background:#3f8f6b;}
#ocorrencias-card .status-dot.print{background:var(--brand-accent);}
#ocorrencias-card .status-dot.pending{background:var(--amber);}
#ocorrencias-card .card-flag{
  font-size:11px;color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-border);
  padding:6px 9px;border-radius:6px;margin-top:10px;
}
#ocorrencias-card .stat-card{justify-content:center;align-items:flex-start;}
#ocorrencias-card .stat-value{font-size:28px;font-weight:800;color:var(--brand-sidebar);line-height:1.1;}
#ocorrencias-card .stat-label{font-size:12.5px;color:var(--text-secondary);margin-top:4px;}
#ocorrencias-card .chart-wrap{position:relative;height:230px;}
#ocorrencias-card .chart-wrap.tall{height:330px;}
#ocorrencias-card .empty-state{
  display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--text-secondary);font-size:12.5px;text-align:center;padding:20px;
}

#ocorrencias-card .legend-donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
#ocorrencias-card .legend-donut .canvasbox{width:150px;height:150px;flex-shrink:0;}
#ocorrencias-card .legend-list{font-size:12px;color:var(--text-primary);display:flex;flex-direction:column;gap:6px;}
#ocorrencias-card .legend-item{display:flex;align-items:center;gap:7px;}
#ocorrencias-card .legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
#ocorrencias-card .legend-pct{color:var(--text-secondary);margin-left:auto;padding-left:14px;}

#ocorrencias-card .map-card svg{width:100%;height:auto;display:block;}
#ocorrencias-card .map-legend{display:flex;gap:12px;font-size:11px;color:var(--text-secondary);flex-wrap:wrap;margin-top:10px;}
#ocorrencias-card .map-legend-item{display:flex;align-items:center;gap:5px;}
#ocorrencias-card .map-legend-swatch{width:11px;height:11px;border-radius:2px;}
#ocorrencias-card .map-tooltip{
  position:absolute;pointer-events:none;background:var(--brand-sidebar);color:#fff;
  font-size:11.5px;padding:6px 9px;border-radius:6px;transform:translate(-50%,-115%);
  opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5;
}
#ocorrencias-card .map-side-stats{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
#ocorrencias-card .map-side-stat{display:flex;justify-content:space-between;font-size:12px;border-top:1px dashed var(--line);padding-top:8px;}
#ocorrencias-card .map-side-stat b{color:var(--text-primary);}

/* spinner overlay (simulated filter reload) */
#ocorrencias-card .loading-overlay{
  position:absolute;inset:0;background:rgba(244,244,244,.72);
  display:none;align-items:center;justify-content:center;z-index:10;
  border-radius:var(--radius);
}
#ocorrencias-card .loading-overlay.active{display:flex;}
#ocorrencias-card .spinner{
  width:34px;height:34px;border-radius:50%;
  border:3px solid var(--brand-badge-bg);border-top-color:var(--brand-sidebar);
  animation:ocorrencias-spin .7s linear infinite;
}
@keyframes ocorrencias-spin{to{transform:rotate(360deg);}}

@media (max-width:900px){
  #ocorrencias-card .grid{grid-template-columns:repeat(4,1fr);}
  #ocorrencias-card main{padding:12px;}
  #ocorrencias-card .filterbar{padding:10px 12px;}
  #ocorrencias-card .filter-note{margin-left:0;width:100%;}
}

Chart.defaults.font.family = "'Inter',system-ui,sans-serif";
Chart.defaults.color = "#828A99";
Chart.defaults.font.size = 11.5;

let activeTab = TAB_ORDER[0];
let currentFilters = {};
const chartInstances = [];

function fmt(n){ return new Intl.NumberFormat('pt-BR').format(n); }
function destroyCharts(){ chartInstances.forEach(c => c.destroy()); chartInstances.length = 0; }
function colorFor(i){ return NAVY_ACCENT[i % NAVY_ACCENT.length]; }
function isEmptyValues(values){
  if (!values || values.length === 0) return true;
  return values.every(v => v === null || v === undefined || v === 0);
}

function renderTabs(){
  const wrap = document.getElementById('oc-tabs');
  wrap.innerHTML = '';
  TAB_ORDER.forEach(key => {
    const tab = DASHBOARD_DATA[key];
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (key === activeTab ? ' active' : '');
    btn.textContent = tab.label;
    btn.onclick = () => { activeTab = key; currentFilters = {}; renderTabs(); renderFilterbar(); renderMain(); };
    wrap.appendChild(btn);
  });
}

function renderFilterbar(){
  const wrap = document.getElementById('oc-filterbar');
  wrap.innerHTML = '';
  const tab = DASHBOARD_DATA[activeTab];
  const hasFilters = tab.filterTypes && tab.filterTypes.length > 0;
  wrap.style.display = hasFilters ? 'flex' : 'none';
  if (!hasFilters) return;
  (tab.filterTypes || []).forEach(ftype => {
    const select = document.createElement('select');
    select.className = 'filter-select';
    select.dataset.filterType = ftype;
    FILTER_OPTIONS[ftype].forEach(opt => {
      const optEl = document.createElement('option');
      optEl.value = opt;
      optEl.textContent = opt;
      select.appendChild(optEl);
    });
    select.addEventListener('change', onFilterChange);
    wrap.appendChild(select);
  });
  if (tab.filterUnconfirmedNote){
    const note = document.createElement('div');
    note.className = 'filter-note';
    note.textContent = '⚠ ' + tab.filterUnconfirmedNote;
    wrap.appendChild(note);
  } else if (tab.filterTypes && tab.filterTypes.length){
    const note = document.createElement('div');
    note.className = 'filter-note';
    note.textContent = 'Integração com o banco real pendente — filtro simulado';
    wrap.appendChild(note);
  }
}

function onFilterChange(){
  const wrap = document.getElementById('oc-filterbar');
  const filtros = {};
  wrap.querySelectorAll('select').forEach(sel => { filtros[sel.dataset.filterType] = sel.value; });
  currentFilters = filtros;
  showLoading(true);
  // Delay simulado só para deixar o spinner testável visualmente antes da integração real.
  setTimeout(() => {
    reloadDashboardData(activeTab, filtros);
    showLoading(false);
  }, 650);
}

function showLoading(state){
  const overlay = document.getElementById('oc-loading');
  overlay.classList.toggle('active', state);
}

/**
 * Ponto único de integração com o banco real.
 * // TODO (integração): Valério — trocar o corpo desta função por uma
 * chamada real à API/consulta que devolve os dados já filtrados para a aba
 * `tabId` conforme `filtros` ({periodo, diretoria, ome, natureza}), e então
 * chamar renderMain() com o resultado atualizado em vez de reusar
 * DASHBOARD_DATA estático como faz hoje.
 */
function reloadDashboardData(tabId, filtros){
  // Protótipo estático: sem backend real ainda, então apenas re-renderiza
  // os mesmos dados validados (demonstra que o fluxo de filtro → spinner →
  // re-render já está pronto para receber dados reais).
  renderMain();
}

function span(n){ return `grid-column: span ${n};`; }

function makeCard(title, colSpan, extraClass, status){
  const card = document.createElement('div');
  card.className = 'card ' + (extraClass || '');
  card.style = span(colSpan);
  if (title){
    const h = document.createElement('div');
    h.className = 'card-title';
    const dot = status ? `<span class="status-dot ${status}" title="${statusLabel(status)}"></span>` : '';
    h.innerHTML = `${dot}<span>${title}</span>`;
    card.appendChild(h);
  }
  return card;
}
function statusLabel(status){
  return status === 'confirmed' ? 'Validado via SQL/CSV'
       : status === 'print' ? 'Validado via print + reconciliação de total'
       : 'Pendente de confirmação';
}

function renderMain(){
  destroyCharts();
  const grid = document.getElementById('oc-grid');
  grid.innerHTML = '<div class="loading-overlay" id="oc-loading"><div class="spinner"></div></div>';
  const tab = DASHBOARD_DATA[activeTab];

  if (tab.sourceNote){
    const note = document.createElement('div');
    note.className = 'source-note';
    note.style = 'grid-column: 1 / -1;';
    note.textContent = tab.sourceNote;
    grid.appendChild(note);
  }

  (tab.stats || []).forEach(s => {
    const card = makeCard(null, 3, 'stat-card');
    const dot = s.status ? `<span class="status-dot ${s.status}" title="${statusLabel(s.status)}" style="margin-bottom:6px;display:inline-block;"></span>` : '';
    card.innerHTML = `${dot}<div class="stat-value">${typeof s.value === 'number' ? fmt(s.value) : s.value}</div><div class="stat-label">${s.label}</div>`;
    grid.appendChild(card);
  });

  (tab.charts || []).forEach(ch => renderChart(grid, ch));
  if (activeTab === 'geolocalizacao') renderMap(grid, tab.map);
}

function renderChart(grid, ch){
  const wideTypes = ['line','line_daily','line_weekly_with_gap','bar_grouped_h'];
  const colSpan = ch.type === 'donut_pct' || ch.type === 'donut_abs' ? 4
                  : wideTypes.includes(ch.type) ? 12
                  : 6;
  const card = makeCard(ch.title, colSpan, null, ch.status);
  if (ch.unit) card.querySelector('.card-title span:last-child').textContent += ` (${ch.unit})`;

  const values = ch.type === 'donut_pct' ? ch.pcts : (ch.values || (ch.raw ? ch.raw.map(r=>r[1]) : null));

  if (ch.type === 'donut_pct' || ch.type === 'donut_abs'){
    if (isEmptyValues(values)){ appendEmptyState(card, 4); grid.appendChild(card); return; }
    const wrap = document.createElement('div');
    wrap.className = 'legend-donut';
    const canvasBox = document.createElement('div');
    canvasBox.className = 'canvasbox';
    const canvas = document.createElement('canvas');
    canvasBox.appendChild(canvas);
    const list = document.createElement('div');
    list.className = 'legend-list';
    ch.labels.forEach((lab, i) => {
      const pct = ch.type === 'donut_pct' ? values[i] : Math.round((values[i]/ch.total)*1000)/10;
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-dot" style="background:${colorFor(i)}"></span>${lab}<span class="legend-pct">${pct}%</span>`;
      list.appendChild(item);
    });
    wrap.appendChild(canvasBox);
    wrap.appendChild(list);
    card.appendChild(wrap);
    if (ch.flag){
      const flag = document.createElement('div');
      flag.className = 'card-flag';
      flag.textContent = '⚠ ' + ch.flag;
      card.appendChild(flag);
    }
    grid.appendChild(card);
    const inst = new Chart(canvas, {
      type: 'doughnut',
      data: { labels: ch.labels, datasets: [{ data: values, backgroundColor: ch.labels.map((_,i)=>colorFor(i)), borderWidth: 2, borderColor:'#fff' }] },
      options: { cutout:'68%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(c)=> ch.type==='donut_pct' ? `${c.label}: ${c.raw}%` : `${c.label}: ${fmt(c.raw)}` } } } }
    });
    chartInstances.push(inst);
    const totalEl = document.createElement('div');
    totalEl.style = 'text-align:center;margin-top:8px;font-size:11px;color:var(--text-secondary);';
    totalEl.innerHTML = `Total: <b style="color:var(--text-primary)">${fmt(ch.total)}</b>`;
    card.appendChild(totalEl);
    return;
  }

  if (isEmptyValues(values) && ch.type !== 'bar_grouped' && ch.type !== 'bar_grouped_h'){
    appendEmptyState(card, wideTypes.includes(ch.type) ? 12 : 6);
    grid.appendChild(card);
    return;
  }

  const wrapEl = document.createElement('div');
  wrapEl.className = 'chart-wrap';
  const canvas = document.createElement('canvas');
  wrapEl.appendChild(canvas);
  card.appendChild(wrapEl);
  grid.appendChild(card);

  if (ch.type === 'bar'){
    const inst = new Chart(canvas, {
      type: 'bar',
      data: { labels: ch.labels, datasets: [{ data: ch.values, backgroundColor: '#970706', borderRadius: 4, maxBarThickness: 46 }] },
      options: baseBarOptions(ch)
    });
    chartInstances.push(inst);
  } else if (ch.type === 'barh'){
    wrapEl.classList.add('tall');
    const inst = new Chart(canvas, {
      type: 'bar',
      data: { labels: ch.labels, datasets: [{ data: ch.values, backgroundColor: '#C51132', borderRadius: 4, maxBarThickness: 26 }] },
      options: { ...baseBarOptions(ch), indexAxis: 'y' }
    });
    chartInstances.push(inst);
  } else if (ch.type === 'histogram'){
    wrapEl.classList.add('tall');
    const inst = new Chart(canvas, {
      type: 'bar',
      data: { labels: ch.labels, datasets: [{ data: ch.values, backgroundColor: '#970706', borderRadius: 3, categoryPercentage:1, barPercentage:1 }] },
      options: baseBarOptions(ch)
    });
    chartInstances.push(inst);
  } else if (ch.type === 'bar_grouped'){
    wrapEl.classList.add('tall');
    let finalLabels, finalDatasets;
    if (ch.series2){
      finalLabels = ch.series[0].labels;
      finalDatasets = [
        { label: ch.series[0].name, data: ch.series[0].values, backgroundColor: '#970706', borderRadius:3, maxBarThickness:22 },
        { label: ch.series2.name, data: ch.series2.values, backgroundColor: '#E9AFB6', borderRadius:3, maxBarThickness:22 },
      ];
    } else {
      const labels = ch.series.flatMap(s => s.labels);
      finalDatasets = ch.series.map((s,i) => ({ label: s.name, data: Array(labels.length).fill(null), backgroundColor: colorFor(i), borderRadius:3, maxBarThickness:22 }));
      let offset = 0;
      ch.series.forEach((s,i) => { s.values.forEach((v,j)=>{ finalDatasets[i].data[offset+j] = v; }); offset += s.labels.length; });
      finalLabels = labels;
    }
    const anyEmpty = isEmptyValues(ch.series.flatMap(s=>s.values));
    if (anyEmpty){ appendEmptyState(card, 6); return; }
    const inst = new Chart(canvas, {
      type: 'bar',
      data: { labels: finalLabels, datasets: finalDatasets },
      options: { ...baseBarOptions(ch), plugins:{ legend:{ display:true, position:'top', labels:{boxWidth:10, font:{size:11}} } } }
    });
    chartInstances.push(inst);
  } else if (ch.type === 'bar_grouped_h'){
    wrapEl.classList.add('tall');
    if (isEmptyValues(ch.series.flatMap(s=>s.values))){ appendEmptyState(card, 12); return; }
    const palette = ['#970706','#E9AFB6','#161A22'];
    const datasets = ch.series.map((s,i) => ({ label: s.name, data: s.values, backgroundColor: ch.series.length === 1 ? '#970706' : palette[i % 3], borderRadius:3, maxBarThickness:16 }));
    const inst = new Chart(canvas, {
      type: 'bar',
      data: { labels: ch.categories, datasets },
      options: { ...baseBarOptions(ch), indexAxis:'y', plugins:{ legend:{ display: ch.series.length>1, position:'top', labels:{boxWidth:10,font:{size:11}} } } }
    });
    chartInstances.push(inst);
  } else if (ch.type === 'line'){
    wrapEl.classList.add('tall');
    const inst = new Chart(canvas, {
      type: 'line',
      data: { labels: ch.values.map((_,i)=>i+1), datasets: [{ data: ch.values, borderColor:'#970706', backgroundColor:'rgba(151,7,6,.07)', fill:true, tension:.25, pointRadius:0, borderWidth:2 }] },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ title:(items)=>`Semana ${items[0].label}`, label:(c)=>fmt(c.raw) } } },
        scales:{ x:{ grid:{display:false} }, y:{ grid:{color:'#eef0f2'} } }
      }
    });
    chartInstances.push(inst);
  } else if (ch.type === 'line_daily'){
    wrapEl.classList.add('tall');
    const labels = ch.raw.map(r=>r[0]);
    const vals = ch.raw.map(r=>r[1]);
    const inst = new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{ data: vals, borderColor:'#970706', backgroundColor:'rgba(151,7,6,.05)', fill:true, tension:.15, pointRadius:0, borderWidth:1.4 }] },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(c)=>fmt(c.raw) } } },
        scales:{ x:{ ticks:{ maxTicksLimit:12, autoSkip:true }, grid:{display:false} }, y:{ grid:{color:'#eef0f2'} } }
      }
    });
    chartInstances.push(inst);
  } else if (ch.type === 'line_weekly_with_gap'){
    wrapEl.classList.add('tall');
    const inst = new Chart(canvas, {
      type: 'line',
      data: { labels: ch.labels, datasets: [{ data: ch.values, borderColor:'#970706', backgroundColor:'rgba(151,7,6,.07)', fill:true, tension:.2, pointRadius:2, borderWidth:2 }] },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(c)=>fmt(c.raw) } } },
        scales:{ x:{ grid:{display:false} }, y:{ grid:{color:'#eef0f2'} } }
      }
    });
    chartInstances.push(inst);
    const note = document.createElement('div');
    note.className = 'card-flag';
    note.textContent = `⚠ ${fmt(ch.semData)} ocorrências adicionais sem data de referência (não representadas na linha do tempo) — pendente decisão de exibição.`;
    card.appendChild(note);
  }
}

function appendEmptyState(card, colSpan){
  card.style = span(colSpan);
  const wrap = document.createElement('div');
  wrap.className = 'chart-wrap';
  wrap.innerHTML = '<div class="empty-state">Nenhum dado encontrado para os filtros selecionados.</div>';
  card.appendChild(wrap);
}

function baseBarOptions(ch){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(c)=> fmt(c.raw) + (ch.unit?(' '+ch.unit):'') } } },
    scales:{
      x:{ grid:{display:false}, ticks:{ autoSkip:false, maxRotation: ch.type==='barh'?0:35, minRotation:0, font:{size:10.5} } },
      y:{ grid:{color:'#eef0f2'} }
    }
  };
}

/* ---------------- Mapa coroplético (Geolocalização) ---------------- */
function bucketColor(v, breaks){
  const scale = ['#F0DEE1','#E9AFB6','#D9707D','#C51132','#970706'];
  for (let i=0;i<breaks.length;i++){ if (v <= breaks[i]) return scale[i]; }
  return scale[scale.length-1];
}
function computeBreaks(values){
  const sorted = [...values].sort((a,b)=>a-b);
  const n = sorted.length;
  const q = p => sorted[Math.min(n-1, Math.floor(p*n))];
  return [q(0.55), q(0.75), q(0.9), q(0.97)];
}
function renderMap(grid, mapData){
  const card1 = makeCard('Ocorrências por cidade', 8, 'map-card', mapData.status);
  const card2 = makeCard('Fernando de Noronha', 4, 'map-card', mapData.status);
  const values = Object.entries(mapData.cityCounts).filter(([k])=>k!=='Fernando de Noronha').map(([,v])=>v);
  const breaks = computeBreaks(values);
  const svgNS = "http://www.w3.org/2000/svg";
  const svg1 = document.createElementNS(svgNS,"svg");
  svg1.setAttribute('viewBox', mapData.mainlandViewBox);
  const tooltip = document.getElementById('oc-map-tooltip');
  Object.entries(mapData.mainlandPaths).forEach(([name, d]) => {
    const path = document.createElementNS(svgNS,'path');
    path.setAttribute('d', d);
    const v = mapData.cityCounts[name] || 0;
    path.setAttribute('fill', v>0 ? bucketColor(v, breaks) : '#F4F4F4');
    path.setAttribute('stroke', '#ffffff');
    path.setAttribute('stroke-width', '0.6');
    path.addEventListener('mousemove', (e) => {
      tooltip.style.opacity = 1; tooltip.style.left = e.pageX + 'px'; tooltip.style.top = e.pageY + 'px';
      tooltip.textContent = `${name}: ${fmt(v)}`;
    });
    path.addEventListener('mouseleave', () => tooltip.style.opacity = 0);
    svg1.appendChild(path);
  });
  card1.appendChild(svg1);
  const legend = document.createElement('div');
  legend.className = 'map-legend';
  const scaleColors = ['#F0DEE1','#E9AFB6','#D9707D','#C51132','#970706'];
  const legendLabels = [`≤ ${fmt(breaks[0])}`, `${fmt(breaks[0]+1)}–${fmt(breaks[1])}`, `${fmt(breaks[1]+1)}–${fmt(breaks[2])}`, `${fmt(breaks[2]+1)}–${fmt(breaks[3])}`, `> ${fmt(breaks[3])}`];
  scaleColors.forEach((c,i) => {
    const item = document.createElement('div');
    item.className = 'map-legend-item';
    item.innerHTML = `<span class="map-legend-swatch" style="background:${c}"></span>${legendLabels[i]}`;
    legend.appendChild(item);
  });
  card1.appendChild(legend);
  const sideStats = document.createElement('div');
  sideStats.className = 'map-side-stats';
  sideStats.innerHTML = `
    <div class="map-side-stat"><span>Não classificado (fora de PE)</span><b>${fmt(mapData.naoClassificado)}</b></div>
    <div class="map-side-stat"><span>Não informado (cidade nula)</span><b>${fmt(mapData.naoInformado)}</b></div>
  `;
  card1.appendChild(sideStats);
  const svg2 = document.createElementNS(svgNS,"svg");
  svg2.setAttribute('viewBox', mapData.noronhaViewBox);
  const path2 = document.createElementNS(svgNS,'path');
  path2.setAttribute('d', mapData.noronhaPath);
  const nv = mapData.cityCounts['Fernando de Noronha'] || 0;
  path2.setAttribute('fill', '#C51132');
  path2.setAttribute('stroke', '#ffffff');
  path2.setAttribute('stroke-width', '1');
  svg2.appendChild(path2);
  card2.appendChild(svg2);
  const nStat = document.createElement('div');
  nStat.style = 'text-align:center;margin-top:10px;';
  nStat.innerHTML = `<div class="stat-value" style="font-size:22px;">${fmt(nv)}</div><div class="stat-label">ocorrências</div>`;
  card2.appendChild(nStat);
  grid.appendChild(card1);
  grid.appendChild(card2);
}

renderTabs();
renderFilterbar();
renderMain();

})();
</script>
