services:
  app:
    build:
      context: .
      args:
        VITE_ADMIN_USUARIO: ${VITE_ADMIN_USUARIO}
        VITE_ADMIN_SENHA: ${VITE_ADMIN_SENHA}
        # Origem publica do backend abaixo — sem isto o front nao sabe pra
        # onde mandar o login por CPF (ver src/lib/authClient.js).
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL}
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend

  # Backend minimo: so faz proxy de autenticacao contra o SGU (ver
  # backend/app.js e DW_PLANEJAMENTO.md, entrada 2026-09-23). O front
  # continua estatico, servido pelo nginx do servico "app" acima.
  backend:
    build:
      context: ./backend
      target: production
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    restart: unless-stopped

networks:
  default:
    name: dw-cbmpe
