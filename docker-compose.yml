services:
  app:
    build:
      context: .
      args:
        # Origem publica do backend abaixo — sem isto o front nao sabe pra
        # onde mandar o login por CPF (ver src/lib/authClient.js).
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL}
        # App interno: sem login local AGGD e sem dado pessoal no bundle (o
        # dado vem do DW pelo backend) — ver Dockerfile e vite.config.js.
        VITE_APP_INTERNO: "1"
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend

  # Backend: autenticacao contra o SGU, mais o estado editavel pelo admin
  # (organograma, atribuicoes de perfil -- no banco `dw`, schema `app`,
  # desde 2026-09-25; ver DW_INGESTAO.md). O front continua estatico,
  # servido pelo nginx do servico "app" acima.
  backend:
    build:
      context: ./backend
      target: production
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    restart: unless-stopped
    # Sem volume: o estado editavel fica no banco (DATABASE_URL_DW), nao
    # no container -- redeploy nao perde nada.

networks:
  default:
    name: dw-cbmpe
