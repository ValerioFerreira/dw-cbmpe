services:
  app:
    build:
      context: .
      args:
        VITE_ADMIN_USUARIO: ${VITE_ADMIN_USUARIO}
        VITE_ADMIN_SENHA: ${VITE_ADMIN_SENHA}
        # Origem publica do backend abaixo — sem isto o front nao sabe pra
        # onde mandar o login por CPF (ver src/lib/authClient.js).
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL}
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend

  # Backend: autenticacao contra o SGU, mais o estado editavel pelo admin
  # (organograma, atribuicoes de perfil -- backend/data/*.json, ver
  # backend/app.js e DW_PLANEJAMENTO.md). O front continua estatico,
  # servido pelo nginx do servico "app" acima.
  backend:
    build:
      context: ./backend
      target: production
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    restart: unless-stopped
    volumes:
      # SEM ISTO, qualquer edicao em /adm (organograma, atribuicoes) some
      # no proximo `docker compose up --build`/redeploy -- backend/data/
      # vira parte da imagem (COPY no Dockerfile), que e sempre substituida
      # do zero. O volume nomeado sobrevive a recriacao do container (some
      # so com `docker compose down -v`, explicito). Achado testando o
      # build real em 2026-09-25 -- ver nota equivalente pro CapRover em
      # backend/.env.example.
      - backend-data:/app/data

volumes:
  backend-data:

networks:
  default:
    name: dw-cbmpe
